<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
        content="#0B7D2B">

    <meta name="description"
        content="Raspadinha da Amizade 2.0">

    <title>🍀 Raspadinha da Amizade</title>

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header class="topo">

        <img
            src="img/logo.png"
            alt="Logo"
            class="logo">

        <h1>

            🍀 RASPADINHA DA AMIZADE

        </h1>

        <p>

            Raspe e descubra se você ganhou!

        </p>

    </header>

    <!-- =====================================================
         PRÊMIOS
    ====================================================== -->

    <main>

        <section class="premios">

            <div class="premio">

                <img
                    src="img/ferro.png"
                    alt="Ferro Elétrico">

                <h2>Ferro Elétrico</h2>

            </div>

            <div class="ou">

                OU

            </div>

            <div class="premio">

                <img
                    src="img/liquidificador.png"
                    alt="Liquidificador">

                <h2>Liquidificador</h2>

            </div>

        </section>

        <!-- =====================================================
             BOTÃO
        ====================================================== -->

        <section class="acao">

            <button id="btnParticipar">

                🎁 RASPE E CONCORRA

            </button>

        </section>

    </main>

 <!-- =====================================================
     MODAL DA RASPADINHA
===================================================== -->

<div id="modalRaspadinha" class="modal hidden">

    <div class="janela">

        <h2>🍀 Boa sorte!</h2>

        <p>Raspe toda a área para descobrir seu prêmio.</p>

      <div class="areaRaspadinha">

    <canvas id="canvasRaspadinha"></canvas>

</div>

        <button id="btnFecharRaspadinha">

            Fechar

        </button>

    </div>

</div>
    
    <div id="statusSistema"></div>

    <script type="module"
        src="js/app.js"></script>

</body>

</html>
