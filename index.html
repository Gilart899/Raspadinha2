<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raspadinha Solidária</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

font-family:Arial, Helvetica, sans-serif;

display:flex;

justify-content:center;

align-items:center;

color:white;


background:

linear-gradient(
rgba(15,23,42,.75),
rgba(15,23,42,.75)
),

url("assets/Fundo.png");


background-size:cover;

background-position:center;

overflow:hidden;

}




/* trevos */


.trevo{

position:absolute;

font-size:40px;

opacity:.4;

animation:

flutuar 12s linear infinite;

}


@keyframes flutuar{


0%{

transform:

translateY(100vh)
rotate(0deg);

}


100%{

transform:

translateY(-120vh)
rotate(360deg);

}


}



.t1{

left:10%;

}


.t2{

left:35%;

animation-duration:10s;

}


.t3{

left:65%;

animation-duration:14s;

}


.t4{

left:85%;

animation-duration:8s;

}





.container{


position:relative;

z-index:2;


width:95%;

max-width:450px;


background:

rgba(17,24,39,.92);


padding:25px;


border-radius:25px;


text-align:center;


box-shadow:

0 0 35px rgba(0,0,0,.5);


}




.logo{

width:120px;

}



h1{

color:#facc15;

margin:10px 0;

}


p{

color:#e5e7eb;

}




button{


width:100%;

padding:16px;


margin-top:20px;


border:none;


border-radius:12px;


background:#16a34a;


color:white;


font-size:18px;


font-weight:bold;


cursor:pointer;


}



button:hover{

transform:scale(1.03);

}



</style>


</head>


<body>


<div class="trevo t1">🍀</div>

<div class="trevo t2">🍀</div>

<div class="trevo t3">🍀</div>

<div class="trevo t4">🍀</div>



<div class="container">



<img 
src="assets/logo.png"
class="logo"
>



<h1>
🎟️ Raspadinha Solidária
</h1>



<p>
Participe e descubra seu prêmio!
</p>




<button onclick="abrirRaspadinha()">

🎁 Jogar Raspadinha

</button>



</div>



<script>


function abrirRaspadinha(){


window.location.href="raspadinha.html";


}


</script>



</body>

</html>
