<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raspadinha Solidária</title>


<style>


*{
box-sizing:border-box;
}



body{

margin:0;

min-height:100vh;

overflow:hidden;

font-family:Arial,sans-serif;

display:flex;

justify-content:center;

align-items:center;

background:

linear-gradient(
135deg,
#0f172a,
#1e293b
);

color:white;

}



/* ==========================
   TREVOS FLUTUANDO
========================== */


.trevo{

position:absolute;

font-size:35px;

opacity:.35;

animation:

subir 10s linear infinite;

}



@keyframes subir{


0%{

transform:
translateY(100vh)
rotate(0deg);

}



100%{

transform:
translateY(-120vh)
rotate(360deg);

}


}



.t1{
left:10%;
animation-duration:8s;
}


.t2{
left:30%;
animation-duration:12s;
}


.t3{
left:60%;
animation-duration:10s;
}


.t4{
left:85%;
animation-duration:14s;
}





/* ==========================
   CONTAINER
========================== */


.container{

position:relative;

z-index:5;

width:95%;

max-width:450px;

background:

rgba(31,41,55,.94);

padding:25px;

border-radius:25px;

text-align:center;

box-shadow:

0 0 35px rgba(255,255,255,.15);

}



/* ==========================
   TITULO
========================== */


h1{

color:#facc15;

margin-bottom:5px;

}



.sub{

color:#d1d5db;

}



/* ==========================
   PREMIOS
========================== */


.premios{

display:flex;

gap:15px;

justify-content:center;

margin:20px 0;

}



.premio{

width:50%;

background:#374151;

border-radius:15px;

padding:10px;

}



.premio img{

width:90px;

height:90px;

object-fit:contain;

}



.premio p{

margin:5px;

font-size:14px;

}



/* ==========================
   INPUT
========================== */


input{


width:100%;

padding:15px;

border-radius:12px;

border:none;

font-size:20px;

text-align:center;

margin-top:10px;


}




button{


width:100%;

padding:16px;

margin-top:15px;

background:#16a34a;

border:none;

border-radius:12px;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

}




button:active{

transform:scale(.97);

}





/* ==========================
   CANVAS
========================== */


#raspadinha{


margin-top:20px;

background:white;

border-radius:15px;

width:100%;

max-width:350px;

box-shadow:

0 0 25px rgba(250,204,21,.5);

}



/* RESULTADO */


#resultado{

margin-top:20px;

font-size:22px;

font-weight:bold;

color:#facc15;

}



</style>


</head>


<body>



<!-- TREVOS -->

<div class="trevo t1">🍀</div>

<div class="trevo t2">🍀</div>

<div class="trevo t3">🍀</div>

<div class="trevo t4">🍀</div>




<div class="container">



<h1>🎟️ Raspadinha Solidária</h1>


<p class="sub">

Digite seu número e descubra seu prêmio

</p>



<div class="premios">



<div class="premio">

<img src="img/Ferro.png">

<p>Ferro elétrico</p>

</div>



<div class="premio">

<img src="img/Liquidificador.png">

<p>Liquidificador</p>

</div>



</div>



<input

id="numero"

maxlength="4"

placeholder="0001"



>


<button onclick="abrirRaspadinha()">

🎁 COMEÇAR RASPAGEM

</button>



<canvas

id="raspadinha"

width="350"

height="200">

</canvas>



<div id="resultado"></div>

     </div>



<!-- ==========================
     FIREBASE SDK
========================== -->


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

"raspadinha2.firebaseapp.com",

<!-- ==========================
     SISTEMA RASPADINHA
========================== -->


<script src="firebase-raspadinha.js"></script>

<script src="raspadinha.js"></script>




<script>


// ================================
// BOTÃO INICIAR
// ================================


function abrirRaspadinha(){



const numero =

document

.getElementById("numero")

.value

.trim();





if(numero.length !== 4){


alert(

"Digite um número válido com 4 dígitos."

);


return;


}




Raspadinha.iniciarRaspadinha(numero);



}



</script>



</body>

</html>
