<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- ======================================================
         CONFIGURAÇÕES
    ======================================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#0B7D2B">

    <meta
        name="description"
        content="Raspadinha Solidária">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="mobile-web-app-capable"
        content="yes">

    <title>🍀 Raspadinha Solidária</title>

    <!-- ======================================================
         CSS
    ======================================================= -->

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<!-- ======================================================
     CABEÇALHO
======================================================= -->

<header class="topo">

    <img

        src="img/logo.png"

        class="logo"

        alt="Logo"

    >

    <h1>

        🍀 RASPADINHA SOLIDÁRIA

    </h1>

    <p>

        Raspe e descubra seu prêmio.

    </p>

</header>

<!-- ======================================================
     CONTEÚDO
======================================================= -->

<main class="principal">

<!-- ======================================================
     ÁREA DOS PRÊMIOS
======================================================= -->

<section class="premios">

    <article class="cardPremio">

        <img

            src="img/ferro.png"

            alt="Ferro Elétrico"

        >

        <h2>

            Ferro Elétrico

        </h2>

    </article>

    <div class="versus">

        OU

    </div>

    <article class="cardPremio">

        <img

            src="img/liquidificador.png"

            alt="Liquidificador"

        >

        <h2>

            Liquidificador

        </h2>

    </article>

</section><!-- ======================================================
     AÇÃO
======================================================= -->

<section class="acoes">

    <button

        id="btnParticipar"

        class="btnPrincipal">

        🎁 RASPAR AGORA

    </button>

</section>

</main>

<!-- ======================================================
     MODAL DA RASPADINHA
======================================================= -->

<div

    id="modalRaspadinha"

    class="modal hidden">

    <div class="janela">

        <button

            id="btnFecharRaspadinha"

            class="btnFechar"

            title="Fechar">

            ✕

        </button>

        <h2>

            🍀 Boa Sorte!

        </h2>

        <p>

            Raspe completamente a área abaixo.

        </p>

        <!-- ===========================================
             ÁREA DA RASPADINHA
        ============================================ -->

        <div class="areaRaspadinha">

            <canvas

                id="canvasRaspadinha"

                width="380"

                height="380">

            </canvas>

        </div>

        <!-- ===========================================
             RESULTADO
        ============================================ -->

        <div

            id="resultadoPremio"

            class="resultadoPremio hidden">

            <img

                id="imagemPremio"

                src=""

                alt="Prêmio">

            <h3

                id="tituloPremio">

            </h3>

            <p

                id="descricaoPremio">

            </p>

        </div>

        <!-- ===========================================
             MENSAGEM
        ============================================ -->

        <div

            id="mensagemPremio"

            class="mensagemPremio">

        </div>

        <!-- ===========================================
             LOADER
        ============================================ -->

        <div

            id="loadingRaspadinha"

            class="loading hidden">

            <div class="spinner"></div>

            <p>

                Consultando sua raspadinha...

            </p>

        </div>

    </div>

</div>

<!-- ======================================================
     STATUS DO SISTEMA
======================================================= -->

<div

    id="statusSistema"

    class="statusSistema">

</div>

<!-- ======================================================
     ÁUDIO
======================================================= -->

<audio

    id="audioRaspar"

    preload="auto"

    src="sounds/raspar.mp3">

</audio>

<audio

    id="audioVitoria"

    preload="auto"

    src="sounds/vitoria.mp3">

</audio>

<audio

    id="audioPerdeu"

    preload="auto"

    src="sounds/perdeu.mp3">

</audio>

<audio

    id="audioClick"

    preload="auto"

    src="sounds/click.mp3">

</audio>

<!-- ======================================================
     RODAPÉ
======================================================= -->

<footer class="rodape">

    <small>

        © 2026 • Raspadinha Solidária

    </small>

</footer>

<!-- ======================================================
     JAVASCRIPT
======================================================= -->

<script

    type="module"

    src="js/app.js">

</script>

</body>

</html>
