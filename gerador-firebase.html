<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gerador Firebase Rifa Solidária</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
    text-align: center;
    padding: 30px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: #1f2937;
    padding: 25px;
    border-radius: 15px;
}

h1 {
    font-size: 24px;
}

button {
    background: #16a34a;
    color: white;
    border: none;
    padding: 15px 25px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: #15803d;
}

.info {
    margin-top: 20px;
    font-size: 14px;
    color: #d1d5db;
}
</style>

</head>

<body>

<div class="container">

<h1>🔥 Gerador Firebase</h1>

<h2>Rifa Solidária</h2>

<p>
Gera automaticamente:
</p>

<p>
✅ 1000 participantes<br>
✅ Configurações<br>
✅ Campanha<br>
✅ Prêmios<br>
✅ Estatísticas<br>
✅ Sistema<br>
✅ Vencedores
</p>

<button onclick="gerarFirebase()">
GERAR FIREBASE-INICIAL-COMPLETO.JSON
</button>

<div class="info" id="status">
Aguardando geração...
</div>

</div>


<script>

function gerarFirebase(){


const firebaseJSON = {


config: {

nomeProjeto: "RIFA ENTRE AMIGOS",

beneficiada: "Dona Bené",

valorNumero: 10,

quantidadeNumeros: 1000

},


campanha: {

titulo: "RIFA ENTRE AMIGOS",

premioPrincipal: "Geladeira Midea Frost Free",

sorteio: "1ª Premiação da Loteria Federal",

dataSorteio: "30/12/2026",

status: "ativa"

},


estatisticas: {

totalNumeros: 1000,

vendidos: 0,

disponiveis: 1000,

raspadinhasRealizadas: 0

},


sistema: {

versao: "1.0",

firebase: true,

raspadinha: true

},


teste: {

modoTeste: false

},


premios: {


ferro: {

nome: "Ferro elétrico",

quantidade: 1,

imagem: "Ferro.png"

},


liquidificador: {

nome: "Liquidificador",

quantidade: 1,

imagem: "Liquidificador.png"

}


},


vencedores:{}

};

  // ===============================
// GERAR PARTICIPANTES 0001-1000
// ===============================

firebaseJSON.participantes = {};

for (let i = 1; i <= 1000; i++) {

    let numero = String(i).padStart(4, "0");

    firebaseJSON.participantes[numero] = {

        numero: numero,

        nome: "",

        telefone: "",

        email: "",

        cidade: "",

        status: "disponivel",

        pagamento: {

            confirmado: false,

            metodo: "",

            data: ""

        },

        raspadinha: {

            liberada: false,

            realizada: false,

            premio: ""

        },

        criadoEm: ""

    };

}


// ===============================
// CONTROLE DE RASPADA
// ===============================

firebaseJSON.teste.raspadinha = {

    ativa: true,

    totalParticipantes: 1000,

    premiosDisponiveis: [

        "Ferro elétrico",

        "Liquidificador"

    ]

};

  // ===============================
// GERAR ARQUIVO JSON
// ===============================

const conteudo = JSON.stringify(
    firebaseJSON,
    null,
    2
);


// Criar arquivo

const blob = new Blob(
    [conteudo],
    {
        type: "application/json"
    }
);


// Criar link de download

const link = document.createElement("a");

link.href = URL.createObjectURL(blob);

link.download = "firebase-inicial-completo.json";


// Baixar arquivo

link.click();


// Mensagem na tela

document.getElementById("status").innerHTML =

"✅ Arquivo firebase-inicial-completo.json gerado com sucesso!<br><br>" +

"1000 participantes criados (0001 até 1000).";

</script>
